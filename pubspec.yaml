name: rt_cnc_app
description: Aplikasi Offset Analyzer Pro - CNC
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.0.0
  google_fonts: ^6.1.0
  intl: ^0.19.0
  image_picker: ^1.0.7
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: "^0.13.1"
  flutter_native_splash: "^2.4.0"

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#070B1C"
  image: "splash.png"
  android_12:
    image: "splash.png"
    color: "#070B1C"
